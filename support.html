<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support - Stacker</title>
    <meta name="description" content="Get help with Stacker, the poker session tracking app.">
    <link rel="canonical" href="https://stackpokertracker.com/support">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #fafafa;
            color: #1a1a1a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        main {
            flex: 1;
            max-width: 480px;
            margin: 0 auto;
            padding: 4rem 1.5rem;
            text-align: center;
        }

        .logo {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, #10b981, #059669);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 2rem;
            margin: 0 auto 1.5rem;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 0.75rem;
        }

        .tagline {
            color: #64748b;
            margin-bottom: 3rem;
        }

        .contact-card {
            background: #ffffff;
            border: 1px solid #e5e5e5;
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .contact-label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #64748b;
            margin-bottom: 0.5rem;
        }

        .contact-email {
            font-size: 1.125rem;
            font-weight: 600;
            color: #10b981;
            text-decoration: none;
        }

        .contact-email:hover {
            text-decoration: underline;
        }

        .response-time {
            margin-top: 1rem;
            font-size: 0.875rem;
            color: #94a3b8;
        }

        footer {
            text-align: center;
            padding: 2rem 1.5rem;
            color: #94a3b8;
            font-size: 0.8125rem;
        }

        footer a {
            color: #64748b;
            text-decoration: none;
        }

        footer a:hover {
            color: #10b981;
        }
    </style>
</head>
<body>
    <main>
        <div class="logo">S</div>
        <h1>Stacker Support</h1>
        <p class="tagline">Poker session tracking app</p>

        <div class="contact-card">
            <p class="contact-label">Contact Us</p>
            <a href="mailto:support@stackerpokertracker.com" class="contact-email">support@stackerpokertracker.com</a>
            <p class="response-time">We typically respond within 24 hours</p>
        </div>
    </main>

    <footer>
        &copy; 2025 Stackflow Inc. | <a href="/privacy">Privacy</a> · <a href="/terms">Terms</a>
    </footer>
</body>
</html>
